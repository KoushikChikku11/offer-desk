[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "offerdesk"
version = "0.1.0"
description = "A recruiting pipeline run like a trading desk: source, score, route, and measure internship applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sai Koushik Chikku" }]
dependencies = [
    "requests>=2.31",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.48", "altair>=5"]
dev = ["pytest>=8"]

[project.scripts]
offerdesk = "offerdesk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
