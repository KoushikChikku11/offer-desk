# Firms to source from.
#   ats:      greenhouse | lever | ashby | manual
#   slug:     the board token in the ATS URL (boards.greenhouse.io/<slug>, jobs.lever.co/<slug>, jobs.ashbyhq.com/<slug>)
#   tier:     1.0 = dream target, lower = still worth it
#   verified: set by `offerdesk probe`. Unverified slugs are best guesses; run probe before trusting them.
